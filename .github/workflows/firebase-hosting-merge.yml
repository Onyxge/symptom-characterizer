# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Install PNPM
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # 2. Install Node.js (Good practice to ensure correct version)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 3. Install Dependencies (Crucial! 'pnpm run build' won't work without this)
      - run: pnpm install

      # 4. Build the app
      - run: pnpm run build

      # 5. Deploy to Firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SYMPTOM_CHARACTERIZER }}'
          channelId: live
          projectId: symptom-characterizer
